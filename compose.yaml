services:
  app:
    build: .
    restart: unless-stopped
    environment:
      APP_ORIGIN: https://${EMBER_DOMAIN:?Set EMBER_DOMAIN to your domain}
      TRUST_PROXY: "true"
    volumes:
      - diary_data:/app/data
    expose:
      - "3000"
    init: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
  proxy:
    image: caddy:2
    restart: unless-stopped
    environment:
      EMBER_DOMAIN: ${EMBER_DOMAIN:?Set EMBER_DOMAIN to your domain}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - proxy_data:/data
      - proxy_config:/config
    depends_on:
      - app
volumes:
  diary_data:
  proxy_data:
  proxy_config:
