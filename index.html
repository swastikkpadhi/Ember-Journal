<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ember Journal</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700;800&family=Source+Serif+4:ital,wght@0,400;0,600;1,400&family=DM+Serif+Display:ital@0;1&family=Caveat:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#f3f6fa;--card:#fff;--fg:#14213d;--mut:#5d6b82;--line:#dde4ee;--acc:#ff5d2e;--sea:#1f8f84;--soft:#e8eef7;--btn:#14213d;--btnfg:#fff}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1626;--card:#18223a;--fg:#e8eefb;--mut:#92a0ba;--line:#2a3652;--acc:#ff7a4d;--sea:#3cc2b3;--soft:#202c49;--btn:#e8eefb;--btnfg:#0f1626}}
:root[data-theme="dark"]{--bg:#0f1626;--card:#18223a;--fg:#e8eefb;--mut:#92a0ba;--line:#2a3652;--acc:#ff7a4d;--sea:#3cc2b3;--soft:#202c49;--btn:#e8eefb;--btnfg:#0f1626}
*,*:before,*:after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.5 "Bricolage Grotesque",system-ui,sans-serif}
main{max-width:640px;margin:0 auto;padding:16px 16px 96px}
h1,h2,h3{margin:0;font-weight:700}h2{font-size:1.15rem;margin:22px 0 10px}
.serif{font-family:"Source Serif 4",Georgia,serif;line-height:1.65}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
.mut{color:var(--mut);font-size:.88rem}
.hero{display:flex;align-items:center;gap:16px;padding:18px;border-radius:20px;background:linear-gradient(135deg,#14213d,#27407a);color:#fff;margin-bottom:12px}
.flame{font-size:3.4rem;line-height:1}
.big{font-size:3rem;font-weight:800;line-height:1}
.week{display:flex;gap:6px;margin-top:10px}
.dot{width:28px;height:28px;border-radius:50%;border:2px solid #ffffff55;display:grid;place-items:center;font-size:.72rem}
.dot.on{background:var(--acc);border-color:var(--acc)}.dot.fz{background:#5cc8ff;border-color:#5cc8ff;color:#06223a}
.bar{height:8px;border-radius:8px;background:var(--soft);overflow:hidden}.bar i{display:block;height:100%;background:var(--sea)}
.hero .bar{background:#ffffff30}.hero .bar i{background:#ffd166}
.moods{display:flex;gap:8px}.moods button{flex:1;font-size:1.6rem;padding:8px 0;border-radius:12px;border:2px solid var(--line);background:var(--card);cursor:pointer}
.moods button.sel{border-color:var(--acc);background:var(--soft)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{padding:5px 11px;border-radius:99px;border:1px solid var(--line);background:var(--card);color:var(--fg);font:inherit;font-size:.88rem;cursor:pointer}
.chip.sel{background:var(--sea);border-color:var(--sea);color:#fff}
textarea,input[type=text],select{width:100%;padding:10px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--fg);font:inherit}
textarea{min-height:130px;resize:vertical;font-family:"Source Serif 4",Georgia,serif;font-size:1.02rem}
input[type=range]{width:100%;accent-color:var(--acc)}
.btn{padding:11px 16px;border-radius:12px;border:0;background:var(--btn);color:var(--btnfg);font:inherit;font-weight:700;cursor:pointer}
.btn.alt{background:var(--soft);color:var(--fg)}.btn.fire{background:var(--acc);color:#fff}
.row{display:flex;gap:8px;align-items:center}.row>*{flex:0 0 auto}.grow{flex:1!important}
label{display:block;font-size:.88rem;color:var(--mut);margin:12px 0 5px}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);display:flex;padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px))}
nav button{flex:1;border:0;background:none;color:var(--mut);font:inherit;font-size:.8rem;padding:6px 0;cursor:pointer}
nav button.on{color:var(--acc);font-weight:700}nav span{display:block;font-size:1.25rem}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:3px solid var(--sea);outline-offset:2px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}
.cal button{aspect-ratio:1;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--fg);font:inherit;font-size:.85rem;cursor:pointer;position:relative}
.cal button.sel{outline:2px solid var(--acc)}.cal button.tod{font-weight:800}.cal b{position:absolute;bottom:3px;left:50%;width:7px;height:7px;margin-left:-3.5px;border-radius:50%}
.entry .meta{display:flex;justify-content:space-between;align-items:center;gap:8px}
.x{border:0;background:none;color:var(--mut);cursor:pointer;font-size:1rem}
.lb{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}.lb:last-child{border:0}
.lb.me{font-weight:800;color:var(--acc)}
.chart{display:flex;align-items:flex-end;gap:4px;height:90px}.chart i{flex:1;border-radius:4px 4px 0 0;background:var(--sea);min-height:3px}
#toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 12px);transform:translateX(-50%);background:var(--btn);color:var(--btnfg);padding:10px 16px;border-radius:12px;font-weight:700;opacity:0;transition:opacity .25s;pointer-events:none;z-index:9}
#toast.show{opacity:1}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}

/* Product blueprint refinements */
main{max-width:760px;padding:clamp(14px,3vw,28px) 16px 108px}
.card{border-radius:18px;padding:clamp(14px,2.6vw,20px);box-shadow:0 4px 18px #14213d0a}
.hero{box-shadow:0 10px 26px #14213d1a}
nav{z-index:5;backdrop-filter:blur(16px);background:color-mix(in srgb,var(--card) 94%,transparent)}
nav button{min-width:54px}
textarea{min-height:170px}
.btn,.chip,.moods button,.cal button{transition:transform .15s ease,filter .15s ease,background-color .15s ease}
.btn:hover,.chip:hover,.moods button:hover,.cal button:hover{filter:brightness(.97);transform:translateY(-1px)}
@media(max-width:430px){body{font-size:15px}.big{font-size:2.5rem}.week{gap:4px}.dot{width:25px;height:25px}.row{flex-wrap:wrap}.row>.grow{flex-basis:100%}nav button{font-size:.68rem}nav span{font-size:1.15rem}}


.welcome-layer{position:fixed;inset:0;z-index:20;display:grid;place-items:center;padding:18px;background:#0c1422bb;backdrop-filter:blur(8px)}
.welcome-card{max-width:440px;width:100%;padding:28px;border-radius:24px;background:var(--card);color:var(--fg);box-shadow:0 24px 80px #0005}.welcome-card h1{font-size:2rem;line-height:1.1;margin:8px 0}.welcome-card .btn{width:100%;margin:8px 0}.welcome-card .x{display:block;margin:8px auto}
input[type=search]{width:100%;padding:10px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--fg);font:inherit}


.auth-shell{min-height:75vh;display:grid;grid-template-columns:1fr 1fr;align-items:center;gap:22px;max-width:850px;margin:8vh auto}.auth-brand{padding:24px}.auth-brand h1{font-size:2.5rem}.auth-card{padding:24px}.auth-card h2{margin-top:0}.auth-submit{width:100%;margin-top:14px}.auth-switch{text-align:center;margin:16px 0}.text-link{border:0;background:none;color:var(--sea);font:inherit;text-decoration:underline;cursor:pointer;padding:0}.terms-check{display:flex;align-items:center;gap:6px}.legal h3{margin-top:18px}.legal p{margin:8px 0}.legal-foot{font-size:.78rem;margin-top:18px}.auth-card input{background:var(--bg)}
@media(max-width:650px){.auth-shell{grid-template-columns:1fr;gap:0;margin:2vh auto}.auth-brand{text-align:center;padding:8px}.auth-brand h1{font-size:2rem}.auth-brand p{margin:4px}}


main:has(.auth-screen){max-width:none;margin:0;padding:0}.auth-screen{--ember:#eb7045;position:relative;isolation:isolate;overflow:hidden;min-height:100vh;margin:0;width:100%;display:grid;place-items:center;padding:clamp(28px,6vw,76px) clamp(18px,5vw,64px);background:radial-gradient(ellipse at 18% 12%,#633a3338,transparent 38%),radial-gradient(ellipse at 90% 88%,#ce663525,transparent 34%),linear-gradient(145deg,#171717,#211b1a 55%,#141515);color:#f8f3ef}
.auth-layout{position:relative;z-index:2;width:min(1060px,100%);display:grid;grid-template-columns:1fr minmax(340px,450px);gap:clamp(36px,8vw,112px);align-items:center}
.auth-story{max-width:470px;animation:authRise .85s cubic-bezier(.2,.7,.2,1) both}.brand-mark,.mini-mark{display:grid;place-items:center;border:1px solid #f2a17a70;color:#ffc19a;background:linear-gradient(145deg,#fa9b6730,#572f2b44);box-shadow:0 0 42px #ef70452a,inset 0 0 18px #ffbe7b15}.brand-mark{width:58px;height:58px;border-radius:20px;font-size:25px;margin-bottom:32px;animation:markGlow 3.8s ease-in-out infinite}.eyebrow{font-size:.68rem;letter-spacing:.19em;font-weight:700;color:#f1a17d;margin:0 0 14px}.auth-story h1{font-size:clamp(3rem,6.6vw,5.3rem);line-height:.98;letter-spacing:-.055em;font-weight:600}.auth-story h1 em{font-family:"Source Serif 4",Georgia,serif;font-weight:400;color:#f1a17d}.story-copy{max-width:350px;color:#c5b7b0;font-size:1.03rem;margin-top:22px}.story-note{display:flex;align-items:center;gap:12px;margin-top:40px;padding-top:18px;border-top:1px solid #ffffff20;color:#cbbcb5;font-size:.87rem}.story-note span:first-child{color:#f1a17d}
.auth-card{position:relative;border:1px solid #ffffff20;border-radius:28px;padding:clamp(22px,4vw,36px);background:linear-gradient(150deg,#ffffff13,#ffffff08 38%,#171514dc);box-shadow:0 28px 100px #0007,inset 0 1px #ffffff15;backdrop-filter:blur(22px);animation:authRise .9s .12s cubic-bezier(.2,.7,.2,1) both}.auth-card-head{display:flex;align-items:center;gap:14px}.mini-mark{width:42px;height:42px;border-radius:15px;font-size:19px;flex:none}.auth-card-head .eyebrow{margin:0 0 3px;font-size:.62rem}.auth-card-head h2{margin:0;font-size:1.55rem}.auth-intro{color:#bfb3ad;font-size:.89rem;margin:14px 0 20px}.auth-card form>label:not(.consent-item){color:#ddd1ca;font-size:.78rem;margin:12px 0 6px}.auth-card input:not([type=checkbox]){background:#ffffff0c;border-color:#ffffff20;color:#fff;padding:12px 14px;border-radius:13px}.auth-card input:not([type=checkbox])::placeholder{color:#8f8580}.auth-card input:not([type=checkbox]):focus{border-color:#e99872;box-shadow:0 0 0 3px #e9987225}.consent-heading{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin:22px 0 9px;font-size:.84rem}.consent-heading .mut{font-size:.7rem}.consent-list{display:grid;gap:8px}.consent-item{display:grid;grid-template-columns:18px 1fr;gap:10px;align-items:start;padding:11px 12px;border:1px solid #ffffff17;border-radius:13px;background:#ffffff08;color:#d8cec8;font-size:.72rem;line-height:1.45;cursor:pointer;transition:background .2s,border-color .2s,transform .2s}.consent-item:hover{background:#ffffff10;transform:translateY(-1px)}.consent-item:has(input:checked){border-color:#ee946c88;background:#ed82501c}.consent-item input{accent-color:#eb8158;width:16px;height:16px;margin:1px 0 0}.consent-item b{display:inline-grid;place-items:center;width:17px;height:17px;margin-right:7px;border-radius:50%;background:#e7906930;color:#ffb291;font-size:.65rem}.consent-progress{text-align:right;color:#ab9e97;font-size:.68rem;margin:8px 0}.auth-submit{width:100%;display:flex;justify-content:space-between;align-items:center;margin-top:12px;border:1px solid #ffbd9270;background:linear-gradient(110deg,#dd704a,#ad513e);box-shadow:0 8px 25px #de704633;color:white}.auth-submit:hover:not(:disabled){filter:brightness(1.08);transform:translateY(-2px);box-shadow:0 12px 30px #de704655}.auth-submit:disabled{opacity:.42;cursor:not-allowed;box-shadow:none}.auth-message{min-height:1.25em;color:#ffb0a3;font-size:.78rem}.auth-switch{text-align:center;color:#c8bcb5;font-size:.78rem;margin:10px 0}.auth-card .text-link{color:#ffb18b}.auth-foot{text-align:center;color:#938780;font-size:.68rem;margin:17px 0 0}.auth-bottom{position:absolute;z-index:2;bottom:10px;color:#938780;font-size:.68rem;letter-spacing:.04em}.ambient{position:absolute;inset:0;overflow:hidden;pointer-events:none}.ambient:before,.ambient:after{content:"";position:absolute;width:40vw;height:40vw;max-width:520px;max-height:520px;border-radius:50%;filter:blur(80px);opacity:.13;animation:orbDrift 14s ease-in-out infinite alternate}.ambient:before{left:-12%;top:3%;background:#e77149}.ambient:after{right:-10%;bottom:-5%;background:#9e4c3b;animation-delay:-7s}.ambient i{position:absolute;left:calc((var(--i)*7.13%) + 2%);bottom:-12px;width:3px;height:3px;border-radius:50%;background:#ffc49d;opacity:0;box-shadow:0 0 11px 2px #fa9d76;animation:emberFloat calc(7s + (var(--i)*.31s)) linear infinite;animation-delay:calc(var(--i)*-.7s)}
.terms-page{max-width:760px;margin:0 auto;padding:20px 0 80px}.terms-top{display:flex;justify-content:space-between;margin-bottom:20px}.terms-page h1{font-size:2.1rem}.terms-page .legal{line-height:1.65}.terms-page .consent-item{color:var(--fg);background:var(--bg);border-color:var(--line)}.terms-page .consent-item:has(input:checked){border-color:var(--sea);background:var(--soft)}.terms-page .consent-item input{accent-color:var(--sea)}.terms-page .btn{margin:14px 0}
@keyframes authRise{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:translateY(0)}}@keyframes markGlow{50%{box-shadow:0 0 58px #ef704550,inset 0 0 25px #ffbe7b26;transform:translateY(-2px)}}@keyframes orbDrift{to{transform:translate(7vw,5vh) scale(1.13)}}@keyframes emberFloat{0%{transform:translate3d(0,0,0) scale(.5);opacity:0}12%{opacity:.65}85%{opacity:.45}100%{transform:translate3d(24px,-105vh,0) scale(1.3);opacity:0}}
@media(max-width:760px){.auth-screen{margin:0;padding:30px 18px 58px;min-height:100vh}.auth-layout{grid-template-columns:1fr;gap:24px;max-width:460px}.auth-story{text-align:center}.brand-mark{margin:0 auto 14px;width:46px;height:46px;border-radius:16px}.auth-story h1{font-size:clamp(2.45rem,12vw,3.7rem)}.story-copy{margin:12px auto 0}.story-note{display:none}.auth-card{padding:22px}.auth-bottom{bottom:14px;text-align:center;width:calc(100% - 28px)}}
@media(prefers-reduced-motion:reduce){.auth-screen *,.auth-screen *:before,.auth-screen *:after{animation:none!important;transition:none!important}}


/* Today page motion and launch reveal */
.today-view{animation:todayEnter .7s cubic-bezier(.2,.75,.25,1) both}.today-heading{position:relative;display:flex;justify-content:space-between;align-items:center;min-height:190px;padding:14px 4px 22px;overflow:hidden}.today-heading h1{font-size:clamp(2.45rem,8vw,4rem);letter-spacing:-.05em;line-height:.98;color:var(--fg)}.today-heading h1 em{font-family:"Source Serif 4",Georgia,serif;font-weight:400;color:var(--acc)}.today-heading .eyebrow{color:var(--sea)}.today-subtitle{color:var(--mut);margin-top:14px}.today-sun{position:absolute;right:3%;top:10px;width:142px;height:142px;border-radius:50%;display:grid;place-items:center;color:#fff8;font-size:2.2rem;background:radial-gradient(circle at 35% 30%,#ffc68c,#f27c4c 46%,#c04e3f 72%,transparent 73%);filter:drop-shadow(0 14px 32px #ed754343);animation:sunBob 5s ease-in-out infinite}.today-sun:before,.today-sun:after{content:"";position:absolute;inset:-10px;border:1px solid #ed815333;border-radius:50%;animation:sunRing 5s ease-out infinite}.today-sun:after{animation-delay:2.5s}.today-hero{position:relative;overflow:hidden;border:1px solid #ffffff20;background:linear-gradient(115deg,#302b35 0%,#4c3541 45%,#a44d3d 120%);box-shadow:0 16px 38px #5b2e251c;animation:todayEnter .65s .08s both}.today-hero:after{content:"";position:absolute;right:-45px;top:-90px;width:220px;height:220px;border-radius:50%;background:#ffb8751c;filter:blur(2px)}.today-hero .flame{position:relative;z-index:1;filter:drop-shadow(0 0 14px #ff9a59)}.flame-lit{animation:flamePulse 2.6s ease-in-out infinite}.streak-kicker{font-size:.65rem;letter-spacing:.16em;color:#f4c1a8}.today-hero .big{font-size:3.4rem;text-shadow:0 2px 18px #ffb18335}.today-hero .week{position:relative;z-index:1}.today-hero .dot{transition:transform .2s,box-shadow .2s}.today-hero .dot.on{box-shadow:0 0 12px #ff855c70}.today-progress{animation:todayEnter .65s .16s both}.today-compose{padding:clamp(18px,4vw,26px);animation:todayEnter .7s .24s both}.compose-top{display:flex;justify-content:space-between;align-items:center}.compose-top h2{margin:0 0 14px;font-size:1.45rem}.compose-top .eyebrow{color:var(--sea)}.compose-star{width:38px;height:38px;border-radius:14px;display:grid;place-items:center;color:var(--acc);background:color-mix(in srgb,var(--acc) 12%,var(--card));animation:starTurn 12s linear infinite}.prompt-panel{padding:14px 16px;border-radius:15px;background:linear-gradient(110deg,color-mix(in srgb,var(--acc) 9%,var(--card)),var(--soft));margin-bottom:14px}.prompt-panel h3{font-size:.9rem}.prompt-panel .serif{min-height:1.5em;margin:8px 0 0}.prompt-next{color:var(--sea)}.today-compose .moods button{border-radius:16px;min-height:52px;box-shadow:0 3px 10px #1720330a}.today-compose .moods button:hover{transform:translateY(-3px) scale(1.025)}.today-compose .moods button.sel{animation:moodPop .28s cubic-bezier(.2,1.4,.4,1);box-shadow:0 6px 18px color-mix(in srgb,var(--acc) 20%,transparent)}.today-compose textarea{transition:border-color .2s,box-shadow .2s}.today-compose textarea:focus{border-color:var(--sea);box-shadow:0 0 0 4px color-mix(in srgb,var(--sea) 12%,transparent)}.today-actions{display:flex;gap:9px;align-items:center;margin-top:14px;flex-wrap:wrap}.today-actions .today-save{flex:1;min-width:190px;display:flex;justify-content:space-between;align-items:center;background:linear-gradient(110deg,#ef7850,#c95a42);box-shadow:0 8px 18px #d7644128}.today-save span{font-size:1.15rem;transition:transform .2s}.today-save:hover span{transform:translateX(4px)}.today-entries-head{display:flex;justify-content:space-between;align-items:end;margin:28px 2px 12px}.today-entries-head .eyebrow{margin:0;color:var(--sea)}.today-entries-head h2{margin:4px 0 0;font-size:1.4rem}.entry-count{padding:5px 10px;border-radius:99px;background:var(--soft);color:var(--mut);font-size:.75rem}.today-view .entry{animation:entryArrive .45s cubic-bezier(.2,.7,.2,1) both}.today-view .entry:nth-of-type(2){animation-delay:.05s}.today-view .entry:nth-of-type(3){animation-delay:.1s}.today-empty{text-align:center;padding:28px 22px;animation:emptyFloat 4s ease-in-out infinite}.empty-glyph{display:grid;place-items:center;margin:0 auto 12px;width:46px;height:46px;border-radius:16px;background:var(--soft);color:var(--sea);font-size:1.4rem}.today-empty p{max-width:360px;margin:6px auto 0;color:var(--mut);font-size:.86rem}

function moodTrendChart(entries,y,m,dim){const byDay=new Map();entries.forEach(e=>{if(!e.m)return;const a=byDay.get(e.d)||[];a.push(e.m);byDay.set(e.d,a)});

const left=68,right=686,top=21,bottom=178,xFor=d=>left+(d-1)*(right-left)/Math.max(1,dim-1),yFor=v=>bottom-(v-1)*(bottom-top)/4;
const grid=[1,2,3,4,5].map(v=>`<g class="trend-grid-row"><line x1="${left}" y1="${yFor(v)}" x2="${right}" y2="${yFor(v)}"/><text x="4" y="${yFor(v)+4}">${MOOD_NAMES[v-1]}</text></g>`).join('');

let segments=[],segment=[];points.forEach(p=>{if(segment.length&&p.d-segment[segment.length-1].d>2){segments.push(segment);segment=[]}segment.push(p)});if(segment.length)segments.push(segment);
const lines=segments.map(seg=>seg.length>1?`<polyline class="trend-line" points="${seg.map(p=>`${xFor(p.d)},${yFor(p.v)}`).join(' ')}"/>`:'').join('');
const dots=points.map(p=>{const rating=Math.max(1,Math.min(5,Math.round(p.v))),key=iso(new Date(y,m,p.d));return `<g class="trend-point" role="button" tabindex="0" aria-label="${key}: ${MOOD_NAMES[rating-1]} average from ${p.n} check-in${p.n===1?'':'s'}" onclick="moodSel='${key}';moodMode='calendar';render()" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();moodSel='${key}';moodMode='calendar';render()}" style="--point-color:${MC[rating-1]}"><title>${key} · ${MOOD_NAMES[rating-1]} (${p.v.toFixed(1)}/5)</title><circle class="trend-hit" cx="${xFor(p.d)}" cy="${yFor(p.v)}" r="13"/><circle class="trend-dot" cx="${xFor(p.d)}" cy="${yFor(p.v)}" r="5.5"/></g>`}).join('');
return `<section class="mood-trend-card" aria-labelledby="mood-trend-title"><div class="mood-trend-heading"><div><p class="eyebrow">MONTHLY PATTERN</p><h4 id="mood-trend-title">Mood changes</h4><small>Daily average from your saved check-ins</small></div><span class="trend-average">${avg.toFixed(1)}<small> / 5 average</small></span></div><div class="mood-trend-plot"><svg viewBox="0 0 700 218" role="img" aria-label="Mood trend for ${new Date(y,m,1).toLocaleString([],{month:'long',year:'numeric'})}. ${points.length} days have mood data. Higher points represent more positive check-ins.">${grid}${ticks}${lines}${dots}</svg></div><div class="trend-chart-footer"><span>Tap a point to see that day</span><span>${points.length} day${points.length===1?'':'s'} with check-ins</span></div></section>`}
function moodCalendar(){const n=new Date();if(!moodCal)moodCal={y:n.getFullYear(),m:n.getMonth()};if(!moodSel)moodSel=today();
const first=new Date(moodCal.y,moodCal.m,1),off=(first.getDay()+6)%7,dim=new Date(moodCal.y,moodCal.m+1,0).getDate(),monthKey=iso(first).slice(0,7);
const monthEntries=S.e.filter(e=>e.d.startsWith(monthKey)&&e.m),monthDays=new Set(monthEntries.map(e=>e.d)).size;
let cells='<div class="mood-weekdays">'+['M','T','W','T','F','S','S'].map((x,i)=>`<span aria-label="${['Monday','Tuesday','Wednesday','Thursday','Friday','Saturday','Sunday'][i]}">${x}</span>`).join('')+'</div><div class="mood-day-grid">'+('<span class="mood-day-spacer"></span>'.repeat(off));
for(let d=1;d<=dim;d++){const key=iso(new Date(moodCal.y,moodCal.m,d)),entries=S.e.filter(e=>e.d===key&&e.m).sort((a,b)=>a.ts-b.ts),avg=entries.length?Math.max(1,Math.min(5,Math.round(entries.reduce((a,e)=>a+e.m,0)/entries.length))):0;

cells+='</div>';
const selected=S.e.filter(e=>e.d===moodSel&&e.m).sort((a,b)=>a.ts-b.ts),nav=(dir)=>`moveMoodMonth(${dir})`;
const monthLabel=first.toLocaleString([],{month:'long',year:'numeric'});
const detail=selected.length?`<div class="mood-day-detail"><div class="mood-detail-title"><b>${new Date(moodSel+'T12:00:00').toLocaleDateString([],{weekday:'long',month:'long',day:'numeric'})}</b><span>${selected.length} check-in${selected.length===1?'':'s'}</span></div>${selected.map(e=>`<div class="mood-detail-row"><span class="mood-face" style="--mood-color:${MC[e.m-1]}">${MOODS[e.m-1]}</span><span class="grow"><b>${MOOD_NAMES[e.m-1]}</b><small>${new Date(e.ts).toLocaleTimeString([],{hour:'numeric',minute:'2-digit'})}${e.q?' · quick log':''}</small></span><span class="mood-detail-tags">${(e.g||[]).slice(0,2).map(t=>`<i>${esc(t)}</i>`).join('')}</span></div>`).join('')}</div>`:`<div class="mood-day-detail mood-day-empty"><b>${new Date(moodSel+'T12:00:00').toLocaleDateString([],{weekday:'long',month:'long',day:'numeric'})}</b><span>No mood check-ins saved for this day.</span></div>`;
const list=monthEntries.slice().sort((a,b)=>b.ts-a.ts).map(e=>`<button class="mood-list-row" type="button" onclick="moodSel='${e.d}';moodMode='calendar';render()"><span class="mood-face" style="--mood-color:${MC[e.m-1]}">${MOODS[e.m-1]}</span><span class="grow"><b>${MOOD_NAMES[e.m-1]}</b><small>${new Date(e.d+'T12:00:00').toLocaleDateString([],{month:'short',day:'numeric',year:'numeric'})} · ${new Date(e.ts).toLocaleTimeString([],{hour:'numeric',minute:'2-digit'})}</small></span><span>›</span></button>`).join('')||'<div class="mood-day-empty">No mood check-ins for this month yet.</div>';const trend=moodTrendChart(monthEntries,moodCal.y,moodCal.m,dim);
return `<section class="mood-calendar-card" aria-labelledby="mood-calendar-title"><div class="mood-calendar-heading"><div><p class="eyebrow">YOUR MOOD HISTORY</p><h3 id="mood-calendar-title">Mood calendar</h3><p class="mut">A gentle view of your check-ins, kept on this device.</p></div><span class="mood-calendar-icon" aria-hidden="true">☻</span></div><div class="mood-mode-switch" role="tablist" aria-label="Mood history view"><button role="tab" aria-selected="${moodMode==='calendar'}" class="${moodMode==='calendar'?'active':''}" onclick="moodMode='calendar';render()">Calendar</button><button role="tab" aria-selected="${moodMode==='list'}" class="${moodMode==='list'?'active':''}" onclick="moodMode='list';render()">List <span>${monthEntries.length}</span></button></div><div class="mood-month-row"><button class="mood-month-arrow" aria-label="Previous mood calendar month" onclick="${nav(-1)}">‹</button><b>${monthLabel}</b><button class="mood-month-arrow" aria-label="Next mood calendar month" onclick="${nav(1)}">›</button></div>${moodMode==='calendar'?`${cells}<div class="mood-calendar-legend">${MOOD_NAMES.map((name,i)=>`<span><i style="--mood-color:${MC[i]}"></i>${name}</span>`).join('')}</div>${detail}`:`<div class="mood-history-list">${list}</div>`}${trend}<div class="mood-month-summary"><span><b>${monthDays}</b> days with a mood</span><span><b>${monthEntries.length}</b> check-ins</span></div></section>`}
function moveMoodMonth(n){moodCal.m+=n;if(moodCal.m<0){moodCal.m=11;moodCal.y--}if(moodCal.m>11){moodCal.m=0;moodCal.y++}moodSel=iso(new Date(moodCal.y,moodCal.m,1));render()}

function weeklyRecap(){const start=wkStart(),es=S.e.filter(e=>e.d>=start),days=new Set(es.map(e=>e.d)).size,avg=es.length?es.reduce((n,e)=>n+e.m,0)/es.length:0;const tags={};es.forEach(e=>e.g.forEach(t=>tags[t]=(tags[t]||0)+1));const frequent=Object.entries(tags).sort((a,b)=>b[1]-a[1])[0];return `<div class="card"><h3>Your week in reflection</h3><p>You wrote on ${days} day${days===1?'':'s'} and saved ${es.length} entr${es.length===1?'y':'ies'}.</p>${avg?`<p class="mut">Your logged mood average was ${avg.toFixed(1)} of 5. This is a snapshot of your check-ins, not a diagnosis.</p>`:''}${frequent?`<p class="mut">You tagged “${esc(frequent[0])}” most often.</p>`:''}<p class="serif">What do you want to carry into next week?</p></div>`}

function toggleReminder(on){if(!on){S.reminderEnabled=false;save();toast('Reminder turned off');render();return}if(!('Notification'in window)){toast('This browser does not support notifications');return}Notification.requestPermission().then(p=>{if(p==='granted'){S.reminderEnabled=true;save();toast('Reminder enabled while this page is open')}else toast('Notification permission was not granted');render()})}

function vReflect(){const recent=S.e.slice().sort((a,b)=>b.ts-a.ts).slice(0,7),moods=recent.filter(e=>e.m).map(e=>e.m),avg=moods.length?moods.reduce((a,b)=>a+b,0)/moods.length:0;const questions=['What would you like to understand better about this week?','What is one thing you handled with care?','What do you need more of tomorrow?'];return `<h2 style="margin-top:6px">Reflection guide</h2><div class="card"><p class="mut">Optional, on-device reflection prompts based on simple journal patterns. Your writing is not sent to an AI service.</p><label><input type="checkbox" ${S.aiEnabled?'checked':''} onchange="S.aiEnabled=this.checked;save();render()"> Enable reflection suggestions</label>${S.aiEnabled?`<div class="card"><b>A question for you</b><p class="serif">${questions[new Date().getDate()%questions.length]}</p>${avg?`<p class="mut">Your last ${moods.length} mood check-ins average ${avg.toFixed(1)} of 5. What do you notice about that?</p>`:''}<button class="btn alt" onclick="toast('Your response is private in this browser. Add it as a journal entry whenever you like.')">Reflect on this</button></div>`:'<p>Turn this on when you want a gentle question. You can switch it off any time.</p>'}</div><div class="card"><h3>Entries you saved</h3>${(S.favorites||[]).map(id=>S.e.find(e=>e.id===id)).filter(Boolean).map(e=>entryHTML(e,true)).join('')||'<p class="mut">Favorite an entry to keep it easy to find.</p>'}</div>`}
function avatarSettings(){return `<section class="card avatar-settings"><div class="avatar-settings-heading"><div><p class="eyebrow">MAKE IT YOURS</p><h3>Your avatar</h3><p class="mut">Choose the emoji that represents you around Ember.</p></div><span class="avatar-preview" id="settings-avatar-preview">${S.avatar||'🙂'}</span></div>${AVATAR_GROUPS.map(group=>`<div class="avatar-group"><b>${group[0]}</b><div class="avatar-options" role="group" aria-label="${group[0]} avatars">${group[1].map(option=>`<button type="button" class="avatar-option ${S.avatar===option[0]?'selected':''}" data-avatar="${option[0]}" aria-label="${option[1]} avatar" aria-pressed="${S.avatar===option[0]}" title="${option[1]}" onclick="setAvatar(this)"><span>${option[0]}</span><small>${option[1]}</small></button>`).join('')}</div></div>`).join('')}<p class="avatar-saved-note">Your choice is saved privately in this browser.</p></section>`}

<div class="card"><h3>Account</h3><p class="mut">Signed in locally as ${esc(accountList().find(a=>a.id===CURRENT_USER)?.email||'')}.</p><div class="row"><button class="btn alt" onclick="authView='terms';renderAuth()">Terms and Conditions</button><button class="btn alt" onclick="logoutAccount()">Log out</button></div><button class="btn" style="background:#a83232;color:white;margin-top:10px" onclick="deleteLocalAccount()">Delete local account</button></div>${avatarSettings()}<div class="card"><h3>Your journal stays on this device</h3><p class="mut">This prototype saves entries in this browser’s local storage. It has no account sync, server backup, encryption-at-rest, or connected AI. Anyone with access to this browser profile may be able to access the journal.</p><button class="btn alt" onclick="exportData()">Export my data</button></div>
<div class="card"><h3>Daily reminder</h3><p class="mut">A gentle browser notification with no journal text. It can fire only while this page is open.</p><label for="reminder-time">Reminder time</label><input id="reminder-time" type="time" value="${S.reminderAt}" onchange="S.reminderAt=this.value;save()"><div class="row" style="margin-top:10px"><button class="btn alt" onclick="toggleReminder(true)">Enable reminder</button><button class="btn alt" onclick="toggleReminder(false)">Turn off</button></div></div><div class="card"><h3>Journal focus</h3><label for="goal-setting">Choose your prompt style</label><select id="goal-setting" onchange="S.goal=this.value;promptOffset=0;save();render()"><option value="reflect" ${S.goal==='reflect'?'selected':''}>Everyday reflection</option><option value="gratitude" ${S.goal==='gratitude'?'selected':''}>Gratitude</option><option value="mood" ${S.goal==='mood'?'selected':''}>Mood awareness</option><option value="goals" ${S.goal==='goals'?'selected':''}>Goals and next steps</option></select></div><div class="card app-theme-settings"><div class="app-theme-title"><div><h3>App appearance</h3><p class="mut">Choose a look for every section. Your choice is saved on this device.</p></div><span aria-hidden="true">✦</span></div><div class="app-theme-grid" role="group" aria-label="Choose an app theme">${APP_THEMES.map(t=>`<button type="button" class="app-theme-option ${S.theme===t[0]?'selected':''}" style="--theme-swatch:${t[2]}" aria-pressed="${S.theme===t[0]}" onclick="setTheme('${t[0]}')"><span class="app-theme-preview" aria-hidden="true"><i></i><i></i><i></i></span><span class="app-theme-text"><b>${t[1]}</b><small>${t[3]}</small></span><span class="app-theme-check" aria-hidden="true">${S.theme===t[0]?'✓':''}</span></button>`).join('')}</div><p class="app-theme-note">Writing-space colors are separate and can be changed in Today.</p><div class="appearance-mode-row"><div class="appearance-mode-copy"><b>Dark mode</b><small>Turn off for the light appearance.</small></div><label class="mode-switch" aria-label="Dark mode"><input type="checkbox" role="switch" aria-label="Dark mode" aria-checked="${S.mode==='dark'}" ${S.mode==='dark'?'checked':''} onchange="setMode(this.checked?'dark':'light')"><span class="mode-switch-track"><i></i></span></label></div></div>
<div class="card"><h3>Reflection guide</h3><p class="mut">AI reflection is not connected in this prototype. Your writing is not sent to an AI service.</p><button class="btn alt" onclick="toast('Try this: What mattered most to you today, and why?')">Get a reflection question</button></div>

<p class="mut" style="text-align:center">Ember Journal prototype · Local data only · No account or cloud sync</p>`}

function showOnboarding(){if(document.getElementById('welcome-layer'))return;const d=document.createElement('div');d.id='welcome-layer';d.className='welcome-layer';d.innerHTML=`<section class="welcome-card" role="dialog" aria-modal="true" aria-labelledby="welcome-title"><p class="mut">WELCOME TO EMBER</p><h1 id="welcome-title">Make a little room to reflect.</h1><p>Your journal is saved in this browser. No account is required, and your writing is not sent to an AI service.</p><label for="goal-choice">What would you like to focus on?</label><select id="goal-choice"><option value="reflect">Everyday reflection</option><option value="gratitude">Gratitude</option><option value="mood">Understanding my mood</option><option value="goals">Goals and next steps</option></select><p class="mut">You can change this later. A short entry counts.</p><button class="btn fire" onclick="finishOnboarding()">Start journaling</button><button class="x" onclick="S.onboardingDone=true;save();document.getElementById('welcome-layer').remove()">Skip setup</button></section>`;document.body.appendChild(d)}
const TERMS_VERSION='ember-terms-2026-10-10-v1';
function accountList(){try{return JSON.parse(localStorage.getItem('ember_accounts')||'[]')}catch(e){return []}}
function accountSave(list){localStorage.setItem('ember_accounts',JSON.stringify(list))}
function bytesToB64(bytes){let x='';bytes.forEach(b=>x+=String.fromCharCode(b));return btoa(x)}
async function passwordHash(password,saltB64){if(!crypto.subtle)throw new Error('Secure password hashing is unavailable in this browser. Open the prototype in a modern browser on localhost.');const salt=saltB64?Uint8Array.from(atob(saltB64),c=>c.charCodeAt(0)):crypto.getRandomValues(new Uint8Array(16));const key=await crypto.subtle.importKey('raw',new TextEncoder().encode(password),'PBKDF2',false,['deriveBits']);const bits=await crypto.subtle.deriveBits({name:'PBKDF2',salt,iterations:210000,hash:'SHA-256'},key,256);return{salt:bytesToB64(salt),hash:bytesToB64(new Uint8Array(bits))}}
function authMessage(t){const n=document.getElementById('auth-message');if(n)n.textContent=t}

function renderAuth(){document.getElementById('nav').innerHTML='';const root=document.getElementById('app');const account=CURRENT_USER&&accountList().find(a=>a.id===CURRENT_USER);if(authView==='terms'){root.innerHTML=`<section class="terms-page"><div class="terms-top"><button class="text-link" onclick="authView=termsReturnView||'login';render()">← Back</button><span class="mut">EMBER JOURNAL</span></div><h1>Terms and Conditions</h1><p class="mut">Prototype terms · Version ${TERMS_VERSION} · Last updated 10 October 2026</p><div class="card legal"><p>These terms apply to this Ember Journal prototype. Read the full terms before continuing.</p><h3>1. Prototype service</h3><p>This version runs in your browser and stores journal entries and account information on this device. It does not provide cloud backup, cross-device sync, account recovery, or hosted support.</p><h3>2. Your account and device</h3><p>Your login is local to this browser. You are responsible for access to your device and for keeping an independent copy of important writing. Clearing browser data may permanently remove your account and journal. Password reset is not available in this prototype.</p><h3>3. Personal use</h3><p>Use the app lawfully and do not attempt to disrupt the app or interfere with another person's data or use.</p><h3>4. Privacy and storage</h3><p>The prototype stores data in browser storage. Journal text is not sent to an Ember server or AI provider. Anyone with access to this browser profile may be able to access local data. Do not use this version for information that requires verified secure storage.</p><h3>5. Wellbeing</h3><p>Ember is a journaling and reflection tool, not medical care, therapy, diagnosis, or emergency support. Contact local emergency services or a qualified professional if you need urgent help.</p><h3>6. Availability and legal rights</h3><p>This prototype may change, become unavailable, or contain errors. These terms are a draft and do not replace rights that cannot legally be excluded or jurisdiction-specific legal review.</p></div>${account&&account.termsVersion!==TERMS_VERSION?`<div class="card"><h2>Confirm to continue</h2><div id="updated-consents" class="consent-list">${consentChecklist('updated-term')}</div><button id="updated-terms-submit" class="btn fire" disabled onclick="acceptUpdatedTerms()">Accept and continue</button><p class="mut">All three confirmations are required.</p><button class="btn alt" onclick="logoutAccount()">Log out</button></div>`:account?`<button class="btn alt" onclick="authView='login';render()">Back to journal</button>`:`<button class="btn alt" onclick="authView=termsReturnView||'login';render()">Back</button>`}</section>`;return}
const registering=authView==='register';root.innerHTML=`<section class="auth-screen"><div class="ambient" aria-hidden="true">${Array.from({length:18},(_,i)=>`<i style="--i:${i}"></i>`).join('')}</div><div class="auth-layout"><div class="auth-story"><div class="brand-mark" aria-hidden="true">✦</div><p class="eyebrow">A QUIET PLACE TO BEGIN</p><h1>Make room<br>for <em>yourself.</em></h1><p class="story-copy">A private moment. A few honest words. A little more understanding.</p><div class="story-note"><span>✦</span><span>Your journal is yours. Start with one small thought.</span></div></div><div class="auth-card"><div class="auth-card-head"><div class="mini-mark">✦</div><div><p class="eyebrow">EMBER JOURNAL</p><h2>${registering?'Create your account':'Welcome back'}</h2></div></div><p class="auth-intro">${registering?'Create a local account to begin your journal.':'Log in to continue your reflection.'}</p><form onsubmit="event.preventDefault();${registering?'registerAccount()':'loginAccount()'}"><label for="auth-email">Email address</label><input id="auth-email" type="email" autocomplete="email" placeholder="you@example.com" required maxlength="180"><label for="auth-password">Password</label><input id="auth-password" type="password" autocomplete="${registering?'new-password':'current-password'}" placeholder="${registering?'At least 10 characters':'Your password'}" required minlength="10" maxlength="256">${registering?`<label for="auth-confirm">Confirm password</label><input id="auth-confirm" type="password" autocomplete="new-password" placeholder="Enter your password again" required minlength="10">`:''}<div class="consent-heading"><b>Before you continue</b><span class="mut">Please confirm all three</span></div><div id="auth-consents" class="consent-list">${consentChecklist('auth-term')}</div><p id="consent-progress" class="consent-progress" aria-live="polite">0 of 3 confirmations complete</p><button id="auth-submit" class="btn fire auth-submit" type="submit" disabled>${ function activateAccount(a){CURRENT_USER=a.id;localStorage.setItem('ember_user',a.id);if(!localStorage.getItem('ember_journal_'+a.id)&&localStorage.getItem('ember')){localStorage.setItem('ember_journal_'+a.id,localStorage.getItem('ember'));localStorage.removeItem('ember')}S=load();S.onboardingDone=true;save();tab='today';if(a.termsVersion!==TERMS_VERSION){authView='terms';renderAuth()}else{render()}}
async function registerAccount(){const email=document.getElementById('auth-email').value.trim().toLowerCase(),password=document.getElementById('auth-password').value,confirmPassword=document.getElementById('auth-confirm').value;if(password.length<10){authMessage('Choose a password with at least 10 characters.');return}if(password!==confirmPassword){authMessage('The passwords do not match.');return}if(!termsAcceptedDraft||document.querySelectorAll('#auth-consents input[type=checkbox]:checked').length!==3){authMessage('Please tick all three confirmations before creating an account.');return}const list=accountList();if(list.some(a=>a.email===email)){authMessage('An account with that email already exists in this browser. Log in instead.');return}try{const h=await passwordHash(password);const a={id:crypto.randomUUID(),email,salt:h.salt,passwordHash:h.hash,termsVersion:TERMS_VERSION,termsAcceptedAt:new Date().toISOString()};list.push(a);accountSave(list);activateAccount(a)}catch(e){authMessage(e.message||'Could not create the local account.')}}
async function loginAccount(){const email=document.getElementById('auth-email').value.trim().toLowerCase(),password=document.getElementById('auth-password').value,a=accountList().find(x=>x.email===email);if(!termsAcceptedDraft||document.querySelectorAll('#auth-consents input[type=checkbox]:checked').length!==3){authMessage('Please tick all three confirmations before logging in.');return}if(!a){authMessage('No local account was found for that email.');return}try{const h=await passwordHash(password,a.salt);if(h.hash!==a.passwordHash){authMessage('Email or password is incorrect.');return}const list=accountList(),profile=list.find(x=>x.id===a.id);profile.termsVersion=TERMS_VERSION;profile.termsAcceptedAt=new Date().toISOString();accountSave(list);activateAccount(profile)}catch(e){authMessage(e.message||'Could not log in.')}}
function acceptUpdatedTerms(){if(document.querySelectorAll('#updated-consents input[type=checkbox]:checked').length!==3){toast('Please complete all three confirmations');return}const list=accountList(),a=list.find(x=>x.id===CURRENT_USER);if(a){a.termsVersion=TERMS_VERSION;a.termsAcceptedAt=new Date().toISOString();accountSave(list)}authView='login';render()}
