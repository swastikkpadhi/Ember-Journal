<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640" role="img" aria-labelledby="title desc">
  <title id="title">Journal insights and reflection</title><desc id="desc">An Ember Journal insights preview with a mood pattern chart and a reflective prompt card.</desc>
  <defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#191615"/><stop offset="1" stop-color="#29201d"/></linearGradient><linearGradient id="line" x2="1"><stop stop-color="#91aa78"/><stop offset="1" stop-color="#f5bd57"/></linearGradient></defs>
  <rect width="1200" height="640" rx="28" fill="url(#bg)"/><text x="58" y="70" fill="#f3e9df" font-family="Georgia,serif" font-size="28">Ember Journal</text><text x="58" y="105" fill="#a99a91" font-family="Arial,sans-serif" font-size="15" letter-spacing="3">INSIGHTS · A KINDER LOOK BACK</text>
  <rect x="52" y="138" width="700" height="440" rx="24" fill="#241f1c" stroke="#453832"/><text x="88" y="184" fill="#f3e5d8" font-family="Georgia,serif" font-size="27">Your mood patterns</text><text x="88" y="213" fill="#a7978b" font-family="Arial,sans-serif" font-size="14">A sample view based on mood check-ins</text>
  <g stroke="#493d36" stroke-width="1"><path d="M114 275h585M114 345h585M114 415h585M114 485h585"/></g><g fill="#a7978b" font-family="Arial,sans-serif" font-size="12"><text x="88" y="279">High</text><text x="88" y="349">Good</text><text x="88" y="419">Okay</text><text x="88" y="489">Low</text></g>
  <path d="M132 446 C186 420 204 348 264 361 S344 424 394 375 S478 302 530 325 S616 390 686 292" fill="none" stroke="url(#line)" stroke-width="6" stroke-linecap="round"/><g fill="#f5bd57" stroke="#241f1c" stroke-width="4"><circle cx="132" cy="446" r="8"/><circle cx="264" cy="361" r="8"/><circle cx="394" cy="375" r="8"/><circle cx="530" cy="325" r="8"/><circle cx="686" cy="292" r="8"/></g><g fill="#a7978b" font-family="Arial,sans-serif" font-size="13"><text x="120" y="530">SEP 28</text><text x="250" y="530">OCT 2</text><text x="380" y="530">OCT 6</text><text x="510" y="530">OCT 10</text><text x="660" y="530">OCT 14</text></g>
  <rect x="790" y="138" width="358" height="440" rx="24" fill="#2d2622" stroke="#514138"/><circle cx="850" cy="204" r="27" fill="#493a31"/><text x="850" y="213" fill="#efaa70" text-anchor="middle" font-size="24">✦</text><text x="824" y="270" fill="#f3e5d8" font-family="Georgia,serif" font-size="25">A moment to reflect</text><text x="824" y="315" fill="#d5c4b5" font-family="Georgia,serif" font-size="19">“What helped you feel</text><text x="824" y="344" fill="#d5c4b5" font-family="Georgia,serif" font-size="19">a little more like yourself</text><text x="824" y="373" fill="#d5c4b5" font-family="Georgia,serif" font-size="19">this week?”</text><path d="M824 406h286" stroke="#54453b"/><text x="824" y="444" fill="#a7978b" font-family="Arial,sans-serif" font-size="14">Take what feels useful.</text><text x="824" y="467" fill="#a7978b" font-family="Arial,sans-serif" font-size="14">There is no right answer.</text><rect x="824" y="497" width="278" height="46" rx="13" fill="#da8655"/><text x="963" y="525" text-anchor="middle" fill="#251914" font-family="Arial,sans-serif" font-size="15" font-weight="bold">Write a reflection</text>
  <text x="58" y="615" fill="#b7a598" font-family="Arial,sans-serif" font-size="13">Illustrative preview · Mood trends depend on the check-ins you record</text>
</svg>
