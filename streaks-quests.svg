<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640" role="img" aria-labelledby="title desc">
  <title id="title">Daily streak and journaling quests</title><desc id="desc">Dark Ember Journal dashboard preview with an ember streak, weekly activity dots, and small journaling quests.</desc>
  <defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#191615"/><stop offset="1" stop-color="#29201d"/></linearGradient><linearGradient id="fire" x2="0" y2="1"><stop stop-color="#ffd078"/><stop offset="1" stop-color="#f16e49"/></linearGradient></defs>
  <rect width="1200" height="640" rx="28" fill="url(#bg)"/><text x="58" y="70" fill="#f3e9df" font-family="Georgia,serif" font-size="28">Ember Journal</text><text x="58" y="105" fill="#a99a91" font-family="Arial,sans-serif" font-size="15" letter-spacing="3">SMALL STEPS, KEPT GENTLY</text>
  <rect x="52" y="138" width="500" height="440" rx="24" fill="#241f1c" stroke="#453832"/><text x="88" y="184" fill="#f3e5d8" font-family="Arial,sans-serif" font-size="17" font-weight="bold">YOUR JOURNALING STREAK</text>
  <path d="M300 246c-18 27-23 45-16 60-28-7-42 17-40 41 1 34 27 56 58 56 35 0 59-24 58-58 0-24-14-45-36-59 2 17-4 25-10 30 1-25-3-47-14-70Z" fill="url(#fire)"/><text x="300" y="357" text-anchor="middle" fill="#321a14" font-family="Arial,sans-serif" font-size="21" font-weight="bold">7</text><text x="300" y="433" text-anchor="middle" fill="#f3e5d8" font-family="Georgia,serif" font-size="27">days in a row</text><text x="300" y="462" text-anchor="middle" fill="#a7978b" font-family="Arial,sans-serif" font-size="14">You showed up for yourself this week.</text>
  <g font-family="Arial,sans-serif" font-size="12" text-anchor="middle" fill="#ad9d92"><text x="139" y="527">M</text><text x="193" y="527">T</text><text x="247" y="527">W</text><text x="301" y="527">T</text><text x="355" y="527">F</text><text x="409" y="527">S</text><text x="463" y="527">S</text></g><g fill="#e98d5d"><circle cx="139" cy="500" r="12"/><circle cx="193" cy="500" r="12"/><circle cx="247" cy="500" r="12"/><circle cx="301" cy="500" r="12"/><circle cx="355" cy="500" r="12"/><circle cx="409" cy="500" r="12"/></g><circle cx="463" cy="500" r="12" fill="#39302b" stroke="#706057" stroke-dasharray="3 3"/>
  <rect x="592" y="138" width="556" height="440" rx="24" fill="#241f1c" stroke="#453832"/><text x="630" y="184" fill="#f3e5d8" font-family="Georgia,serif" font-size="27">A few gentle quests</text><text x="630" y="213" fill="#a7978b" font-family="Arial,sans-serif" font-size="14">Little prompts to help you keep going</text>
  <g><rect x="628" y="242" width="484" height="86" rx="16" fill="#2d2622"/><circle cx="670" cy="285" r="23" fill="#624735"/><text x="670" y="292" text-anchor="middle" font-size="22">✍</text><text x="710" y="278" fill="#f3e5d8" font-family="Arial,sans-serif" font-size="16" font-weight="bold">Write for five minutes</text><text x="710" y="302" fill="#ad9d92" font-family="Arial,sans-serif" font-size="13">A small pause for your thoughts</text><rect x="1021" y="273" width="63" height="24" rx="12" fill="#c68151"/><text x="1052" y="290" text-anchor="middle" fill="#271a14" font-family="Arial,sans-serif" font-size="12" font-weight="bold">1 / 1</text></g>
  <g><rect x="628" y="344" width="484" height="86" rx="16" fill="#2d2622"/><circle cx="670" cy="387" r="23" fill="#46513a"/><text x="670" y="394" text-anchor="middle" font-size="22">☾</text><text x="710" y="380" fill="#f3e5d8" font-family="Arial,sans-serif" font-size="16" font-weight="bold">Add a mood check-in</text><text x="710" y="404" fill="#ad9d92" font-family="Arial,sans-serif" font-size="13">Name how you feel today</text><rect x="1021" y="375" width="63" height="24" rx="12" fill="#46513a"/><text x="1052" y="392" text-anchor="middle" fill="#dce4ce" font-family="Arial,sans-serif" font-size="12" font-weight="bold">DONE</text></g>
  <g><rect x="628" y="446" width="484" height="86" rx="16" fill="#2d2622"/><circle cx="670" cy="489" r="23" fill="#564763"/><text x="670" y="496" text-anchor="middle" font-size="22">✧</text><text x="710" y="482" fill="#f3e5d8" font-family="Arial,sans-serif" font-size="16" font-weight="bold">Look back at one entry</text><text x="710" y="506" fill="#ad9d92" font-family="Arial,sans-serif" font-size="13">Celebrate a moment you kept</text><rect x="1021" y="477" width="63" height="24" rx="12" fill="#4a3d50"/><text x="1052" y="494" text-anchor="middle" fill="#e5d8eb" font-family="Arial,sans-serif" font-size="12" font-weight="bold">0 / 1</text></g>
  <text x="58" y="615" fill="#b7a598" font-family="Arial,sans-serif" font-size="13">Illustrative preview · Progress shown here is sample content</text>
</svg>
