<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640" role="img" aria-labelledby="title desc">
  <title id="title">Notebook-inspired writing space</title><desc id="desc">A warm dark-themed digital journal page with a writing area and theme and font options.</desc>
  <defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#191615"/><stop offset="1" stop-color="#29201d"/></linearGradient><linearGradient id="paper" x2="0" y2="1"><stop stop-color="#d9bda0"/><stop offset="1" stop-color="#c9a987"/></linearGradient></defs>
  <rect width="1200" height="640" rx="28" fill="url(#bg)"/><text x="58" y="70" fill="#f3e9df" font-family="Georgia,serif" font-size="28">Ember Journal</text><text x="58" y="105" fill="#a99a91" font-family="Arial,sans-serif" font-size="15" letter-spacing="3">TODAY · YOUR WRITING SPACE</text>
  <rect x="54" y="135" width="1092" height="470" rx="25" fill="#241f1c" stroke="#453832"/><text x="88" y="184" fill="#f6e8d9" font-family="Georgia,serif" font-size="27">A little space for today</text><text x="88" y="211" fill="#a7978b" font-family="Arial,sans-serif" font-size="14">OCTOBER 10, 2026 · TAKE A MOMENT</text>
  <rect x="86" y="236" width="660" height="332" rx="18" fill="url(#paper)"/><path d="M128 298H704M128 348H704M128 398H704M128 448H704M128 498H704" stroke="#9c7a5e" opacity=".23" stroke-width="2"/><path d="M157 258v284" stroke="#a86651" opacity=".65" stroke-width="2"/><text x="183" y="285" fill="#573e30" font-family="Georgia,serif" font-size="25" font-style="italic">Today, I want to remember...</text><text x="183" y="335" fill="#684b39" font-family="Georgia,serif" font-size="20" font-style="italic">The quiet moments that made me smile.</text><text x="183" y="385" fill="#684b39" font-family="Georgia,serif" font-size="20" font-style="italic">A warm cup, a deep breath, and time to</text><text x="183" y="435" fill="#684b39" font-family="Georgia,serif" font-size="20" font-style="italic">notice how far I have come.</text><text x="183" y="525" fill="#8b6b50" font-family="Arial,sans-serif" font-size="13">YOUR THOUGHTS ARE YOURS</text>
  <rect x="779" y="236" width="332" height="332" rx="18" fill="#2d2622" stroke="#4c3e36"/><text x="808" y="276" fill="#f3e5d8" font-family="Arial,sans-serif" font-size="17" font-weight="bold">Make it feel like yours</text><text x="808" y="310" fill="#a7978b" font-family="Arial,sans-serif" font-size="13">PAGE STYLE</text>
  <g><rect x="808" y="326" width="76" height="46" rx="9" fill="#c9a987"/><path d="M820 341h52M820 350h52M820 359h42" stroke="#755943" opacity=".5"/><rect x="895" y="326" width="76" height="46" rx="9" fill="#a98983"/><path d="M907 341h52M907 350h52M907 359h42" stroke="#664840" opacity=".5"/><rect x="982" y="326" width="76" height="46" rx="9" fill="#8c9a76"/><path d="M994 341h52M994 350h52M994 359h42" stroke="#4d5b43" opacity=".6"/></g>
  <text x="808" y="410" fill="#a7978b" font-family="Arial,sans-serif" font-size="13">WRITING FONT</text><rect x="808" y="426" width="270" height="47" rx="11" fill="#211c1a" stroke="#514138"/><text x="828" y="456" fill="#e9d9ca" font-family="Georgia,serif" font-size="17">Georgia · Calm &amp; classic</text><path d="m1052 446 8 8 8-8" fill="none" stroke="#c5a68f" stroke-width="2"/>
  <rect x="808" y="493" width="270" height="44" rx="12" fill="#da8655"/><text x="943" y="521" fill="#251914" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" font-weight="bold">Save today's entry</text>
  <text x="58" y="620" fill="#b7a598" font-family="Arial,sans-serif" font-size="13">Illustrative preview · Your page styles and fonts can be changed in the app</text>
</svg>
